name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compila l'APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        with:
          name: BuoniPasto-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Pubblica l'APK nelle Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSIONE=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/*.apk "BuoniPasto-v${VERSIONE}.apk"
          gh release create "v${VERSIONE}-build${{ github.run_number }}" "BuoniPasto-v${VERSIONE}.apk" \
            --title "BuoniPasto ${VERSIONE} (build ${{ github.run_number }})" \
            --notes "APK compilato automaticamente da GitHub Actions."
      - name: Registro degli errori
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "log-build${{ github.run_number }}" build.log --prerelease \
            --title "Errori build ${{ github.run_number }}" --notes "Registro della compilazione non riuscita."
